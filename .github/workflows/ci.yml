name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # themes/mistpine must match the generator and the current mistpine spec.
      - run: pnpm check
      # Ghostty itself must accept the theme and resolve every color to the spec.
      - name: Install Ghostty
        run: sudo snap install ghostty --classic
      - run: pnpm verify
