name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # themes/mistpine must match the generator and the current mistpine spec.
    # Ghostty itself must accept the theme and resolve every color to the spec.
    uses: mistpine/port-kit/.github/workflows/port.yml@v0.1.0
    with:
      verify: true
      setup: sudo snap install ghostty --classic
